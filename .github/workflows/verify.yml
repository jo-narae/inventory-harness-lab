# 기계 검증 — 로컬의 `npm run verify` 와 같은 것을 그대로 돌린다.
# CI 전용 단계를 여기에 따로 적지 않는다. 순서가 바뀌면 package.json 한 곳만 고친다.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행은 취소한다
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prepare → Types → Lint → Test → Domain Verify → Build
      # DATABASE_URL 은 verify 스크립트가 검증용 DB로 직접 지정한다.
      - run: npm run verify
        env:
          # 실제 비밀값이 아니다. .env.example 이 요구하는 변수를 CI 에서도 채워둘 뿐이다.
          # 검증 경로는 로그인을 거치지 않으므로 값 자체는 쓰이지 않는다.
          SESSION_SECRET: ci-placeholder-not-a-real-secret
