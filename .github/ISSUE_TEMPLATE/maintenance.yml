name: 유지보수 작업
description: 에이전트가 작업을 시작하는 데 필요한 6개 항목을 채운다
title: "[작업] "
body:
  - type: markdown
    attributes:
      value: |
        이 Issue 는 **개별 유지보수 작업의 원본**이다 (`docs/harness/00-ssot.md §1`).
        여기 적힌 범위 안에서만 코드를 고치고, 범위를 넘겨야 하면 Issue 를 먼저 고친다.

        도메인·아키텍처 결정이 바뀌는 작업이면 Issue 가 아니라
        `docs/01-requirements.md` · `docs/06-architecture.md` 를 먼저 갱신한다 (`00-ssot.md §0`).

  - type: textarea
    id: background
    attributes:
      label: 1. 배경 — 왜 필요한가
      description: 지금 무엇이 문제이고, 고치지 않으면 무엇이 잘못되는가. 관련 문서·절 번호를 함께 적는다.
      placeholder: |
        예) 로트 소진 후에도 목록에 남아 FEFO 선택 후보로 잡힌다.
        근거: docs/01-requirements.md §3 F5-1
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경할 내용 — 무엇을 수정하는가
      description: 바꿀 대상을 파일·함수 단위로 적는다. 방법이 아니라 대상과 결과를 적는다.
      placeholder: |
        예)
        - src/lib/fefo.ts — 잔량 0 로트를 후보에서 제외한다
        - src/app/products/[id]/page.tsx — 로트 목록에서 소진 로트를 기본으로 숨긴다
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 3. 종료 조건 — 무엇이 참이면 완료인가
      description: |
        종료 조건은 실행해서 참·거짓을 확인할 수 있게 쓴다.
        기준일·수치·기대 결과를 문장 안에 넣는다.

        되는 예
        - 만료 로트 6개 폐기 시 OWN -6, DISPOSAL +6이 된다.
        - 폐기 전후 모든 거점의 Lot.quantity 합계가 동일하다.

        안 되는 예
        - 폐기 기능이 정상적으로 동작한다. → 누가 "정상"을 판정하나
        - 조회 함수가 대상 로트를 정확히 반환한다. → 입력도 기대값도 없다
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 4. 기계 검증 — 어떤 테스트가 판정하는가
      description: |
        종료 조건을 판정하는 테스트를 적는다.
        이 Issue의 전용 테스트는 `tests/issues/issue-{Issue 번호}-{기능명}.test.ts`에 만든다.
        종료 조건마다 대응하는 테스트가 있어야 한다.
      value: |
        - 공통: `npm run verify`
        - Issue 전용 테스트:
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: 5. 건드리면 안 되는 것 — 변경 경계는 어디인가
      description: |
        이번 작업에서 손대지 않을 경로와 규칙을 적는다.
        보호 영역(`00-ssot.md §5`)은 읽기만 하며, 바꿔야 하면 변경안을 내고 승인을 받는다.
      value: |
        - `docs/01-requirements.md` · `docs/06-architecture.md` — 읽기만 한다
        - `docs/harness/` · `AGENTS.md` · `CLAUDE.md` — 읽기만 한다
        - `tests/issues/` 의 다른 Issue 테스트와 `tests/` 최상위 기존 테스트 — 고치지 않는다
        - `applyMovement()` 외의 재고 수량 변경 통로를 새로 만들지 않는다 (`06 §4.1`)
        - 시드 상품은 배열 뒤에만 붙인다 (`handsover/01 §6`)
        - 
    validations:
      required: true

  - type: dropdown
    id: loop-limit
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: 정한 횟수 안에 검증을 통과하지 못하면 멈추고 사람에게 보고한다.
      options:
        - "1회"
        - "2회"
        - "3회"
        - "5회"
      default: 2
    validations:
      required: true

